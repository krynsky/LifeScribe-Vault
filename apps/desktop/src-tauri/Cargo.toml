[package]
name = "lifescribe-vault-v2"
version = "0.2.0"
description = "Local encrypted digital legacy vault (v2)"
authors = ["LifeScribe Vault"]
edition = "2021"

[lib]
name = "lifescribe_vault_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Creator-only commands (pack write/export) compile in only for creator builds.
# End-user binaries are built without this feature; U10 gates its commands on it.
creator-mode = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
dirs = "5"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
