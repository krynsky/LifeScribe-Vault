[package]
name = "lifescribe-vault-v2"
version = "1.0.1"
description = "Local encrypted digital legacy vault (v2)"
authors = ["LifeScribe Vault"]
edition = "2021"

[lib]
name = "lifescribe_vault_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
dirs = "5"
# Strips the `\\?\` verbatim prefix `fs::canonicalize` produces on Windows, so
# the stored vault-location pointer holds a path Explorer and the shell accept.
dunce = "1"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
open = "5"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
